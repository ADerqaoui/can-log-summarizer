[pytest]
# Where pytest discovers tests
testpaths = tests

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers used to categorize tests, run selectively with: pytest -m unit
markers =
    unit: fast isolated tests, no external dependencies
    integration: tests across multiple components, may use real Ollama
    system: tests on real-world data, slow, run on schedule
    slow: tests that take more than ~1s, run separately

# Default options applied to every pytest invocation
addopts =
    --strict-markers
    --tb=short
    -ra

# Treat warnings as errors so we catch deprecations early
filterwarnings =
    error
    ignore::DeprecationWarning:cantools.*
    ignore::DeprecationWarning:can.*
